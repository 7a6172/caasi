[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caasi"
version = "0.1.0"
description = "A lightweight, CLI-first orchestration layer for NVIDIA Isaac Sim, Isaac Lab and the robotics ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "a6y3ap" }]
keywords = ["caasi", "isaac", "isaac-sim", "isaac-lab", "robotics", "cli", "ros2", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/a6y3ap/caasi"
Repository = "https://github.com/a6y3ap/caasi"
Documentation = "https://a6y3ap.github.io/caasi/"
Issues = "https://github.com/a6y3ap/caasi/issues"

[project.scripts]
caasi = "caasi.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/caasi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
